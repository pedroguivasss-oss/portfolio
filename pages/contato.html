<body data-pagina="contato">

  <header class="topo">
    <div class="container topo__conteudo">
      <a href="../index.html" class="topo__nome">Pedro Guimarães Vasconcellos</a>
      <button class="menu-botao" id="menu-botao" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <nav class="menu" id="menu" aria-label="Menu principal">
        <a href="../index.html" data-link="inicio">Início</a>

        <a href="contato.html" data-link="contato">Contato</a>
      </nav>
    </div>
  </header>

  <main class="container conteudo">
    <h1>Contato</h1>
    <p>Se quiser falar comigo, pode me chamar por aqui:</p>

    <ul class="lista">
      <li>E-mail: <a href="mailto:seuemail@exemplo.com">seuemail@exemplo.com</a></li>
      <li>WhatsApp: <a href="https://wa.me/5500000000000" target="_blank" rel="noopener">(00) 00000-0000</a></li>
      <li>Instagram: <a href="https://www.instagram.com/seu-usuario" target="_blank" rel="noopener">@seu-usuario</a></li>
    </ul>

    <h2>Mandar uma mensagem</h2>
    <form class="formulario" id="formulario" data-email="seuemail@exemplo.com" novalidate>
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" autocomplete="name">
      <span class="erro" id="erro-nome"></span>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <span class="erro" id="erro-email"></span>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="5"></textarea>
      <span class="erro" id="erro-mensagem"></span>

      <button type="submit">Enviar</button>
      <p class="aviso" id="aviso" role="status"></p>
    </form>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>&copy; <span id="ano">2026</span> Pedro Guimarães Vasconcellos</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/contato.js"></script>
