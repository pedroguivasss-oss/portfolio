<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <!-- Ilustração: balcão de loja de eletrônicos -->
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241b3d"/>
      <stop offset="1" stop-color="#14202e"/>
    </linearGradient>
    <linearGradient id="destaque" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="tela" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="480" height="560" fill="url(#parede)"/>

  <!-- Letreiro da loja -->
  <rect x="120" y="40" width="240" height="56" rx="14" fill="#0f1420" stroke="url(#destaque)" stroke-width="4"/>
  <text x="240" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e9ecf1">TECNOLOGIA</text>

  <!-- Prateleira com celulares -->
  <rect x="40" y="200" width="400" height="10" rx="5" fill="#3b3360"/>
  <g>
    <rect x="70" y="120" width="44" height="80" rx="8" fill="#111827"/>
    <rect x="74" y="126" width="36" height="66" rx="5" fill="url(#tela)"/>
    <rect x="130" y="128" width="40" height="72" rx="8" fill="#111827"/>
    <rect x="134" y="134" width="32" height="58" rx="5" fill="#f472b6"/>
    <rect x="186" y="120" width="44" height="80" rx="8" fill="#111827"/>
    <rect x="190" y="126" width="36" height="66" rx="5" fill="#34d399"/>
  </g>
  <!-- Fone de ouvido na prateleira -->
  <path d="M268 190 C 268 140, 340 140, 340 190" fill="none" stroke="#e9ecf1" stroke-width="8" stroke-linecap="round"/>
  <rect x="258" y="170" width="22" height="32" rx="8" fill="#8b5cf6"/>
  <rect x="328" y="170" width="22" height="32" rx="8" fill="#8b5cf6"/>
  <!-- Relógio inteligente -->
  <rect x="372" y="150" width="40" height="50" rx="10" fill="#111827"/>
  <rect x="377" y="156" width="30" height="38" rx="6" fill="#0ea5e9"/>
  <rect x="384" y="138" width="16" height="12" rx="3" fill="#475569"/>

  <!-- Smart TV / monitor -->
  <rect x="80" y="240" width="200" height="120" rx="10" fill="#0b0d12" stroke="#2f3747" stroke-width="6"/>
  <rect x="92" y="252" width="176" height="96" rx="4" fill="url(#tela)" opacity=".85"/>
  <path d="M160 282 l36 18 l-36 18 z" fill="#fff" opacity=".9"/>
  <rect x="170" y="360" width="20" height="18" fill="#2f3747"/>

  <!-- Etiqueta de preço -->
  <g transform="translate(320 250) rotate(8)">
    <path d="M0 0 h80 l20 25 l-20 25 h-80 z" fill="#fbbf24"/>
    <circle cx="86" cy="25" r="5" fill="#241b3d"/>
    <text x="38" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#241b3d">OFERTA</text>
  </g>

  <!-- Balcão -->
  <rect x="20" y="378" width="440" height="26" rx="8" fill="url(#destaque)"/>
  <rect x="40" y="404" width="400" height="156" fill="#1d2433"/>
  <rect x="60" y="424" width="170" height="116" rx="10" fill="#242c3d"/>
  <rect x="250" y="424" width="170" height="116" rx="10" fill="#242c3d"/>

  <!-- Notebook no balcão -->
  <path d="M300 378 l12 -58 h96 l12 58 z" fill="#2f3747"/>
  <path d="M308 372 l10 -46 h82 l10 46 z" fill="url(#tela)" opacity=".8"/>
  <rect x="290" y="374" width="140" height="6" rx="3" fill="#475569"/>

  <!-- Maquininha de cartão -->
  <rect x="60" y="334" width="40" height="44" rx="8" fill="#111827"/>
  <rect x="66" y="340" width="28" height="14" rx="3" fill="#34d399"/>
  <g fill="#475569">
    <circle cx="70" cy="362" r="3"/><circle cx="80" cy="362" r="3"/><circle cx="90" cy="362" r="3"/>
    <circle cx="70" cy="370" r="3"/><circle cx="80" cy="370" r="3"/><circle cx="90" cy="370" r="3"/>
  </g>

  <!-- Nota musical (o hobby) -->
  <path d="M430 300 v36 a10 8 0 1 1 -5 -7 v-38 l24 -7 v9 z" fill="#f472b6" opacity=".85"/>
</svg>
