<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Avatar ilustrado: vendedor com fones de ouvido no pescoço.
       Substitua por uma foto sua (ex.: img/foto.jpg) -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="camisa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2430"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <clipPath id="circulo">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circulo)">
    <rect width="400" height="400" fill="url(#fundo)"/>
    <circle cx="70" cy="80" r="70" fill="#fff" opacity=".1"/>
    <circle cx="345" cy="300" r="100" fill="#fff" opacity=".08"/>

    <!-- Notas musicais flutuando -->
    <g fill="#fff" opacity=".55">
      <path d="M318 62 v34 a9 7 0 1 1 -4 -6 v-34 l22 -6 v8 z"/>
      <path d="M70 250 v28 a8 6 0 1 1 -4 -5 v-30 l20 -5 v26 a8 6 0 1 1 -4 -5 v-17 z"/>
    </g>

    <!-- Corpo (camisa polo) -->
    <path d="M62 400 C 70 305, 135 268, 200 268 C 265 268, 330 305, 338 400 Z" fill="url(#camisa)"/>
    <!-- Gola polo -->
    <path d="M164 270 L200 300 L186 318 L150 282 Z" fill="#2f3747"/>
    <path d="M236 270 L200 300 L214 318 L250 282 Z" fill="#2f3747"/>
    <path d="M190 300 h20 v40 h-20 z" fill="#161a22"/>
    <circle cx="200" cy="316" r="3" fill="#9aa3b5"/>
    <circle cx="200" cy="330" r="3" fill="#9aa3b5"/>
    <!-- Crachá -->
    <rect x="248" y="318" width="48" height="26" rx="5" fill="#fff"/>
    <rect x="255" y="326" width="34" height="4" rx="2" fill="#8b5cf6"/>
    <rect x="255" y="334" width="22" height="4" rx="2" fill="#cbd5e1"/>

    <!-- Pescoço -->
    <rect x="176" y="222" width="48" height="54" rx="20" fill="#e8b48f"/>

    <!-- Fones de ouvido no pescoço -->
    <path d="M140 262 C 140 300, 260 300, 260 262" fill="none" stroke="#111827" stroke-width="10" stroke-linecap="round"/>
    <rect x="124" y="244" width="30" height="40" rx="12" fill="#111827"/>
    <rect x="130" y="250" width="18" height="28" rx="8" fill="#a78bfa"/>
    <rect x="246" y="244" width="30" height="40" rx="12" fill="#111827"/>
    <rect x="252" y="250" width="18" height="28" rx="8" fill="#a78bfa"/>

    <!-- Orelhas -->
    <ellipse cx="132" cy="178" rx="12" ry="18" fill="#e8b48f"/>
    <ellipse cx="268" cy="178" rx="12" ry="18" fill="#e8b48f"/>
    <!-- Rosto -->
    <ellipse cx="200" cy="168" rx="68" ry="74" fill="#f3c7a2"/>

    <!-- Cabelo -->
    <path d="M130 170 C 120 105, 160 78, 205 80 C 255 82, 284 112, 272 172
             C 266 140, 248 122, 222 118 C 200 132, 160 128, 142 120 C 134 135, 131 150, 130 170 Z" fill="#2b1d16"/>

    <!-- Sobrancelhas -->
    <path d="M158 150 q 13 -7 26 0" fill="none" stroke="#2b1d16" stroke-width="5" stroke-linecap="round"/>
    <path d="M216 150 q 13 -7 26 0" fill="none" stroke="#2b1d16" stroke-width="5" stroke-linecap="round"/>
    <!-- Olhos -->
    <circle cx="171" cy="170" r="6" fill="#1a1f2b"/>
    <circle cx="229" cy="170" r="6" fill="#1a1f2b"/>
    <circle cx="173" cy="168" r="2" fill="#fff"/>
    <circle cx="231" cy="168" r="2" fill="#fff"/>
    <!-- Bochechas -->
    <circle cx="156" cy="200" r="9" fill="#f29b8f" opacity=".45"/>
    <circle cx="244" cy="200" r="9" fill="#f29b8f" opacity=".45"/>
    <!-- Sorriso aberto -->
    <path d="M178 202 Q 200 228 222 202 Z" fill="#7f1d1d"/>
    <path d="M182 204 Q 200 212 218 204 Z" fill="#fff"/>
  </g>
</svg>
