<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Capa: Pagode e samba (pandeiro e cavaquinho) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <pattern id="bolinhas" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="3" fill="#fff" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#bolinhas)"/>

  <!-- Cavaquinho atrás -->
  <g transform="rotate(35 260 190)">
    <rect x="252" y="40" width="16" height="140" rx="3" fill="#422006"/>
    <rect x="246" y="26" width="28" height="22" rx="6" fill="#422006"/>
    <ellipse cx="260" cy="200" rx="34" ry="32" fill="#a16207"/>
    <ellipse cx="260" cy="246" rx="44" ry="40" fill="#a16207"/>
    <circle cx="260" cy="218" r="12" fill="#422006"/>
  </g>

  <!-- Pandeiro -->
  <g transform="translate(160 200)">
    <circle r="96" fill="#fef3c7"/>
    <circle r="96" fill="none" stroke="#78350f" stroke-width="16"/>
    <circle r="72" fill="none" stroke="#fde68a" stroke-width="2" opacity=".8"/>
    <!-- Platinelas -->
    <g fill="#d1d5db" stroke="#6b7280" stroke-width="2">
      <ellipse cx="0" cy="-96" rx="12" ry="7"/>
      <ellipse cx="83" cy="-48" rx="12" ry="7" transform="rotate(60 83 -48)"/>
      <ellipse cx="83" cy="48" rx="12" ry="7" transform="rotate(-60 83 48)"/>
      <ellipse cx="0" cy="96" rx="12" ry="7"/>
      <ellipse cx="-83" cy="48" rx="12" ry="7" transform="rotate(60 -83 48)"/>
      <ellipse cx="-83" cy="-48" rx="12" ry="7" transform="rotate(-60 -83 -48)"/>
    </g>
    <!-- Mão batendo -->
    <path d="M-20 -10 q 30 -20 50 0" fill="none" stroke="#065f46" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  </g>

  <!-- Notas -->
  <g fill="#fff" opacity=".8">
    <path d="M320 60 v30 a8 6 0 1 1 -4 -5 v-32 l20 -5 v8 z"/>
    <path d="M60 80 v26 a8 6 0 1 1 -4 -5 v-28 l18 -5 v24 a8 6 0 1 1 -4 -5 v-15 z"/>
  </g>

</svg>
