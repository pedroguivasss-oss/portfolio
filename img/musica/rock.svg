    <rect x="166" y="240" width="48" height="12" rx="3" fill="#111827"/>
    <rect x="166" y="266" width="48" height="12" rx="3" fill="#111827"/>
    <rect x="172" y="292" width="36" height="8" rx="2" fill="#cbd5e1"/>
    <g stroke="#e5e7eb" stroke-width="1.2">
      <line x1="186" y1="40" x2="186" y2="296"/><line x1="190" y1="40" x2="190" y2="296"/><line x1="194" y1="40" x2="194" y2="296"/>
