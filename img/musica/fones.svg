<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- Ilustração: fones de ouvido cercados de notas musicais -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="almofada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2430"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/>
  <circle cx="240" cy="250" r="160" fill="#fff" opacity=".1"/>

  <!-- Arco dos fones -->
  <path d="M110 270 C 110 120, 370 120, 370 270" fill="none" stroke="#111827" stroke-width="26" stroke-linecap="round"/>
  <path d="M110 270 C 110 120, 370 120, 370 270" fill="none" stroke="#2f3747" stroke-width="10" stroke-linecap="round"/>

  <!-- Conchas -->
  <rect x="78" y="240" width="74" height="120" rx="32" fill="url(#almofada)"/>
  <rect x="96" y="256" width="40" height="88" rx="20" fill="#a78bfa"/>
  <rect x="328" y="240" width="74" height="120" rx="32" fill="url(#almofada)"/>
  <rect x="344" y="256" width="40" height="88" rx="20" fill="#a78bfa"/>

  <!-- Equalizador entre as conchas -->
  <g fill="#fff">
    <rect x="186" y="290" width="14" height="50" rx="5" opacity=".9"/>
    <rect x="206" y="260" width="14" height="80" rx="5"/>
    <rect x="226" y="275" width="14" height="65" rx="5" opacity=".9"/>
    <rect x="246" y="245" width="14" height="95" rx="5"/>
    <rect x="266" y="280" width="14" height="60" rx="5" opacity=".9"/>
    <rect x="286" y="300" width="14" height="40" rx="5" opacity=".8"/>
  </g>

  <!-- Notas musicais -->
  <g fill="#fff">
    <path d="M70 90 v40 a11 8 0 1 1 -5 -7 v-42 l28 -7 v10 z" opacity=".85"/>
    <path d="M380 60 v34 a10 8 0 1 1 -5 -7 v-36 l26 -7 v34 a10 8 0 1 1 -5 -7 v-22 z" opacity=".9"/>
    <path d="M400 390 v30 a9 7 0 1 1 -4 -6 v-32 l22 -6 v8 z" opacity=".7"/>
    <path d="M60 400 v28 a9 7 0 1 1 -4 -6 v-30 l20 -5 v26 a9 7 0 1 1 -4 -6 v-16 z" opacity=".7"/>
  </g>
</svg>
